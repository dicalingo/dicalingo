<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<link rel="icon" type="image/jpeg" href="./InShot_20261015_233634057.jpg">
<link rel="apple-touch-icon" href="./InShot_20261015_233634057.jpg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FFF9F5">
<title>Dicalingo | دیکالینگو</title>
<meta name="description" content="دیکالینگو؛ آموزش زبان انگلیسی">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
--orange:#FF5A00;
--navy:#171B2E;
--cream:#FFF9F5;
--peach:#FFE2D2;
--mint:#DDF2E7;
--lavender:#EAE3FA;
--yellow:#FFF0B9;
--muted:#777B89
}

*{box-sizing:border-box;margin:0;padding:0}

html{scroll-behavior:smooth}

body{
font-family:Vazirmatn,sans-serif;
background:var(--cream);
color:var(--navy);
overflow-x:hidden
}

a{
text-decoration:none;
color:inherit;
-webkit-tap-highlight-color:transparent
}

.container{
width:min(1080px,92%);
margin:auto
}

/* Header */

header{
height:76px;
display:flex;
align-items:center;
position:sticky;
top:0;
z-index:20;
background:#fff9f5ed;
backdrop-filter:blur(14px);
border-bottom:1px solid #171b2e0d
}

.nav{
display:flex;
align-items:center;
justify-content:space-between;
gap:15px
}

.logo{
font-size:25px;
font-weight:900;
white-space:nowrap
}

.logo span{color:var(--orange)}

nav{
display:flex;
align-items:center;
gap:27px;
font-size:14px;
font-weight:700;
color:#626575
}

nav a{transition:.2s}

nav a:hover,
nav a.active{color:var(--orange)}

/* Search */

.search-section{
margin:25px auto 0
}

.search-box{
display:flex;
align-items:center;
gap:12px;
background:white;
border:1px solid #171b2e12;
border-radius:16px;
padding:6px 17px;
min-height:58px;
box-shadow:0 5px 18px #171b2e06;
transition:.2s
}

.search-box:focus-within{
border-color:var(--orange);
box-shadow:0 0 0 3px #ff5a0012
}

.search-icon{
font-size:23px;
color:var(--muted);
line-height:1
}

.search-box input{
flex:1;
min-width:0;
border:0;
outline:0;
background:transparent;
font-family:inherit;
font-size:14px;
color:var(--navy)
}

.search-box input::placeholder{
color:#999BA5
}

.search-box button{
border:0;
background:var(--navy);
color:white;
font-family:inherit;
font-size:12px;
font-weight:700;
padding:10px 17px;
border-radius:10px;
cursor:pointer;
transition:.2s
}

.search-box button:hover{
background:var(--orange)
}

.search-results{
display:none;
margin-top:10px;
background:white;
border:1px solid #171b2e12;
border-radius:14px;
overflow:hidden
}

.search-results.show{display:block}

.search-result{
display:block;
padding:13px 17px;
font-size:13px;
border-bottom:1px solid #171b2e0c;
transition:.2s
}

.search-result:last-child{border-bottom:0}

.search-result:hover{
background:#fff1e9;
color:var(--orange)
}

.search-empty{
padding:15px 17px;
font-size:13px;
color:var(--muted)
}

/* Intro */

.intro{
margin:25px auto 0;
background:var(--navy);
color:white;
border-radius:23px;
padding:22px 28px;
display:flex;
align-items:center;
justify-content:space-between;
gap:18px
}

.intro h2{
font-size:19px;
font-weight:900;
margin-bottom:4px
}

.intro p{
font-size:12px;
line-height:2;
color:#d1d3dc
}

.intro-mark{
width:48px;
height:48px;
border-radius:16px;
background:var(--orange);
display:grid;
place-items:center;
font-size:25px;
flex-shrink:0
}

/* Quick Links */

.quick-links{
display:grid;
grid-template-columns:1fr 1fr;
gap:16px;
margin:22px auto
}

.quick-card{
min-height:115px;
padding:20px 23px;
border-radius:22px;
display:flex;
align-items:center;
gap:14px;
transition:.25s
}

.quick-card:hover{
transform:translateY(-4px);
box-shadow:0 12px 25px #171b2e10
}

.quick-card.courses{background:var(--mint)}

.quick-card.products{background:var(--lavender)}

.quick-card h3{
font-size:18px;
font-weight:900
}

.quick-card p{
font-size:11px;
color:#626575;
margin-top:5px
}

.quick-icon{
width:48px;
height:48px;
border-radius:15px;
background:#ffffffb8;
display:grid;
place-items:center;
font-size:23px;
flex-shrink:0
}

.arrow{
font-size:22px;
color:var(--orange);
margin-right:auto
}

/* Footer */

footer{padding:18px 0 24px}

.footer-inner{
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
border-top:1px solid #171b2e12;
padding-top:16px
}

.footer-copy{
font-size:11px;
color:var(--muted)
}

.socials{
display:flex;
align-items:center;
gap:9px
}

.socials a{
width:auto;
min-width:36px;
height:36px;
padding:0 10px;
white-space:nowrap;
border-radius:12px;
background:white;
display:grid;
place-items:center;
color:var(--navy);
font-size:12px;
font-weight:900;
transition:.2s
}

.socials a:hover{
background:var(--orange);
color:white;
transform:translateY(-2px)
}

a:focus-visible{
outline:3px solid var(--orange);
outline-offset:4px
}

/* Mobile */

@media(max-width:700px){

header{height:66px}

.logo{font-size:21px}

nav{
gap:13px;
font-size:12px
}

.search-section{margin-top:18px}

.search-box{
min-height:53px;
padding:5px 12px;
gap:9px
}

.search-box input{font-size:12px}

.search-box button{
padding:9px 12px;
font-size:11px
}

.intro{
padding:17px 19px;
border-radius:19px
}

.intro h2{font-size:16px}

.intro p{font-size:11px}

.quick-links{gap:10px}

.quick-card{
padding:14px;
min-height:105px;
gap:9px
}

.quick-card h3{font-size:14px}

.quick-card p{font-size:10px}

.quick-icon{
width:38px;
height:38px;
font-size:19px
}

.arrow{font-size:17px}

}

@media(max-width:360px){

.container{width:94%}

nav{
gap:9px;
font-size:11px
}

.logo{font-size:19px}

.quick-card{padding:11px}

.quick-card h3{font-size:13px}

}

@media(prefers-reduced-motion:reduce){

*,*:before,*:after{
animation:none!important;
transition:none!important;
scroll-behavior:auto!important
}

}
</style>
</head>

<body>

<header>
<div class="container nav">

<a class="logo" href="index.html">دیـ<span>کالینگو</span></a>

<nav aria-label="منوی اصلی">
<a class="active" href="index.html">خانه</a>
<a href="courses.html">دوره‌ها</a>
<a href="products.html">محصولات</a>
</nav>

</div>
</header>

<main class="container">

<!-- Search -->

<section class="search-section">

<form class="search-box" id="siteSearch">

<span class="search-icon">⌕</span>

<input
type="search"
id="searchInput"
placeholder="جست‌وجو در دیکالینگو..."
aria-label="جست‌وجو در سایت"
autocomplete="off"
>

<button type="submit">جست‌وجو</button>

</form>

<div class="search-results" id="searchResults"></div>

</section>

<!-- About -->

<section class="intro">

<div>
<h2>درباره دیکالینگو</h2>
<p>یک برند آموزشی در حوزه زبان انگلیسی.</p>
</div>

<div class="intro-mark">✦</div>

</section>

<!-- Quick Links -->

<section class="quick-links">

<a class="quick-card courses" href="courses.html">

<div class="quick-icon">📚</div>

<div>
<h3>دوره‌های آموزشی</h3>
<p>مشاهده دوره‌ها و سطح‌های آموزشی</p>
</div>

<span class="arrow">←</span>

</a>

<a class="quick-card products" href="products.html">

<div class="quick-icon">✦</div>

<div>
<h3>محصولات</h3>
<p>مشاهده محصولات آموزشی</p>
</div>

<span class="arrow">←</span>

</a>

</section>

</main>

<footer>

<div class="container footer-inner">

<div class="footer-copy">© ۲۰۲۶ دیکالینگو</div>

<div class="socials">

<a href="https://instagram.com/dicalingo" target="_blank" rel="noopener noreferrer" aria-label="اینستاگرام">اینستاگرام</a>

<a href="https://t.me/dicalingo" target="_blank" rel="noopener noreferrer" aria-label="تلگرام">تلگرام</a>

<a href="https://www.youtube.com/@dicalingo" target="_blank" rel="noopener noreferrer" aria-label="یوتیوب">یوتیوب</a>

</div>

</div>

</footer>

<script>

const searchForm = document.getElementById("siteSearch");
const searchInput = document.getElementById("searchInput");
const searchResults = document.getElementById("searchResults");

const pages = [
{
title:"صفحه اصلی",
keywords:["خانه","دیکالینگو","dicalingo"],
url:"index.html"
},
{
title:"دوره‌های آموزشی",
keywords:["دوره","دوره ها","آموزش","سطح","a1","a2","b1","b2","c1","کلاس"],
url:"courses.html"
},
{
title:"محصولات آموزشی",
keywords:["محصول","محصولات","جزوه","pdf","منابع","تمرین","فایل"],
url:"products.html"
}
];

searchForm.addEventListener("submit",function(event){

event.preventDefault();

const query = searchInput.value.trim().toLowerCase();

searchResults.innerHTML = "";
searchResults.classList.add("show");

if(!query){
searchResults.innerHTML =
'<div class="search-empty">عبارتی برای جست‌وجو وارد کن.</div>';
return;
}

const matches = pages.filter(page => {

return page.title.toLowerCase().includes(query) ||
page.keywords.some(keyword => keyword.includes(query) || query.includes(keyword));

});

if(matches.length === 0){

searchResults.innerHTML =
'<div class="search-empty">نتیجه‌ای پیدا نشد.</div>';

return;

}

matches.forEach(page => {

const link = document.createElement("a");

link.href = page.url;
link.className = "search-result";
link.textContent = page.title;

searchResults.appendChild(link);

});

});

searchInput.addEventListener("input",function(){

if(!searchInput.value.trim()){
searchResults.classList.remove("show");
searchResults.innerHTML = "";
}

});

</script>

</body>
</html>
